<!DOCTYPE html>
<html>
<body>
  <canvas id="c192" width="192" height="192" style="border:1px solid #ccc"></canvas>
  <canvas id="c512" width="512" height="512" style="border:1px solid #ccc"></canvas>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Achtergrond gradient (identiek aan je app)
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#06b6d4'); // Cyan
      grad.addColorStop(0.5, '#14b8a6'); // Teal
      grad.addColorStop(1, '#2563eb'); // Blue
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.22); // Afgeronde app-icoon hoeken
      ctx.fill();

      // Logo schalen en tekenen
      const scale = size / 36;
      ctx.save();
      ctx.scale(scale, scale);

      // Midden bol
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(18, 18, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Bogen
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.arc(18, 18, 14, -Math.PI / 2, 0); // 18 4 naar 32 18
      ctx.stroke();

      ctx.globalAlpha = 0.75;
      ctx.beginPath();
      ctx.arc(18, 18, 14, 0, Math.PI / 2);
      ctx.stroke();

      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.arc(18, 18, 14, Math.PI / 2, Math.PI);
      ctx.stroke();

      ctx.globalAlpha = 0.25;
      ctx.beginPath();
      ctx.arc(18, 18, 14, Math.PI, (3 * Math.PI) / 2);
      ctx.stroke();

      // Gestippelde binnenring
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 1.75;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.arc(18, 18, 8.5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();

      // Download triggeren
      const link = document.createElement('a');
      link.download = `pwa-${size}x${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    drawIcon('c192', 192);
    drawIcon('c512', 512);
  </script>
</body>
</html>
